name: Vercel CI/CD

# Preview deploy for every PR / non-main push; production deploy on main.
on:
  push:
    branches: [main, Simple-design]
  pull_request:
    branches: [main, Simple-design]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1) Verify the app actually builds before we ship it.
  # ---------------------------------------------------------------------------
  verify:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Backend: install deps + import smoke test -----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt

      - name: Install backend deps
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend import smoke test
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          # Exercise the serverless code path (SQLite -> /tmp, lazy init).
          VERCEL: "1"
        run: |
          python -c "
          import main
          from fastapi.testclient import TestClient
          c = TestClient(main.app)
          assert c.get('/api/health').json()['status'] == 'ok'
          assert c.post('/api/auth/demo').status_code == 200
          print('backend OK')
          "

      # ---- Frontend: install deps + production build -----------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend deps
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2) Deploy with the Vercel CLI (preview or production).
  #    Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  #    The linked Vercel project's Root Directory should be the repo root.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    # Skip on forked-PRs, where secrets are unavailable.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # @vercel/python's build step shells out to `uv` to install
      # dependencies. Vercel's own cloud builders ship it preinstalled;
      # a plain GitHub-hosted runner does not, so `vercel build` fails
      # with "uv is required but was not found in PATH" without this.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Deploying to PRODUCTION"
            vercel pull  --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod                          --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --prod        --token="$VERCEL_TOKEN")
          else
            echo "Deploying PREVIEW"
            vercel pull  --yes --environment=preview     --token="$VERCEL_TOKEN"
            vercel build                                 --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt               --token="$VERCEL_TOKEN")
          fi
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Vercel preview deployed: ${url}`,
            });
